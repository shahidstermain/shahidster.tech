name: SEO Build Verification

on:
  push:
    branches:
      - seo/position-tracking-2026-08

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build SSG site
        run: npm run build
      - name: Verify homepage SEO output
        run: |
          grep -F "Shahid Moosa | Cloud Database Support Engineer | PostgreSQL & Distributed SQL" dist/index.html
          grep -F 'rel="canonical" href="https://shahidster.tech"' dist/index.html
          grep -F 'application/ld+json' dist/index.html
      - name: Verify blog hub SEO output
        run: |
          grep -F "Database & Distributed Systems Engineering Blog | Shahid Moosa" dist/blog/index.html
          grep -F 'rel="canonical" href="https://shahidster.tech/blog"' dist/blog/index.html
          grep -F 'application/ld+json' dist/blog/index.html
