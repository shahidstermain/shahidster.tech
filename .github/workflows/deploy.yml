name: Build canonical portfolio for Hostinger

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "hostinger-production"
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build production site
        run: npm run build

      - name: Preserve Hostinger Apache routing & API
        run: |
          cp public/.htaccess dist/.htaccess
          cp -r public/api dist/api

      - name: Verify production output
        shell: bash
        run: |
          test -f dist/index.html
          test -f dist/.htaccess
          test -f dist/robots.txt
          test -f dist/api/db.php
          test -f dist/api/health.php

      - name: Publish build to Hostinger branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b hostinger-deploy
          git add -A
          git commit -m "Deploy ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin hostinger-deploy
