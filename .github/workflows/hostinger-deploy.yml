name: Build Hostinger production branch

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hostinger-production
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_LEMONSQUEEZY_STORE_ID: ${{ vars.VITE_LEMONSQUEEZY_STORE_ID || 'shahidster' }}
      VITE_LEMONSQUEEZY_PRODUCT_VARIANT_ID: ${{ vars.VITE_LEMONSQUEEZY_PRODUCT_VARIANT_ID || 'database-201-pro' }}
      VITE_BUTTONDOWN_USERNAME: ${{ vars.VITE_BUTTONDOWN_USERNAME || 'shahidmoosa' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        run: npm run build

      - name: Preserve Hostinger Apache routing
        run: cp public/.htaccess dist/.htaccess

      - name: Verify production output
        shell: bash
        run: |
          test -f dist/index.html
          test -f dist/.htaccess
          test -f dist/robots.txt

      - name: Publish dist to hostinger-deploy branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b hostinger-deploy
          git add -A
          git commit -m "Deploy ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin hostinger-deploy
