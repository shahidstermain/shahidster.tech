name: Dependency Autofix Issue 15

on:
  push:
    branches:
      - fix/security-gate-dependencies-15

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply non-breaking npm audit fixes
        run: npm audit fix || true

      - name: Commit lockfile/package updates
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency file changes produced by npm audit fix."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "fix: remediate dependency vulnerabilities for #15"
            git push
          fi

      - name: Audit remaining high vulnerabilities
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Build verification
        run: npm run build
