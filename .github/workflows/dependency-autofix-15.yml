name: Dependency Autofix Issue 15

on:
  push:
    branches:
      - fix/security-gate-dependencies-15

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Upgrade markdown lint toolchain
        run: npm install --save-dev markdownlint-cli@0.49.1

      - name: Apply remaining non-breaking fixes
        run: npm audit fix || true

      - name: Commit dependency updates
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency file changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "fix: clear high-severity dependency audit findings for #15"
            git push
          fi

      - name: Enforce high-severity audit gate
        run: npm audit --audit-level=high

      - name: Markdown lint verification
        run: npm run lint-md

      - name: Build verification
        run: npm run build
